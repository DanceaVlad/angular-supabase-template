<header
    class="border-b sticky top-0 z-50 bg-background/95 backdrop-blur supports-backdrop-filter:bg-background/60"
>
    <div class="flex h-14 items-center gap-2 px-4">
        <button hlmBtn variant="ghost" size="icon" aria-label="Toggle sidebar">
            <ng-icon hlm name="lucideMenu" />
        </button>

        <a class="font-semibold text-foreground" href="/">MyApp</a>

        @if (isDevMode) {
            <button
                [hlmDropdownMenuTrigger]="devMenu"
                hlmBtn
                variant="outline"
                size="icon"
                aria-label="Developer tools"
            >
                <ng-icon hlm name="lucideTerminal" />
            </button>
        }

        <ng-template #devMenu>
            <hlm-dropdown-menu class="w-48">
                <hlm-dropdown-menu-group>
                    @if (authState().status === AuthStatus.UNAUTHENTICATED) {
                        <button hlmDropdownMenuItem (click)="devSignIn()">
                            <ng-icon hlm size="sm" name="lucideUser" class="text-foreground" />
                            <span>Sign in as dev</span>
                        </button>
                    }
                    <button hlmDropdownMenuItem variant="destructive" (click)="devDeleteUsers()">
                        <ng-icon hlm size="sm" name="lucideUserX" class="text-foreground" />
                        <span>Delete all users</span>
                    </button>
                </hlm-dropdown-menu-group>
            </hlm-dropdown-menu>
        </ng-template>

        <div class="flex-1"></div>

        @if (authState().status === AuthStatus.UNAUTHENTICATED) {
            <a hlmBtn routerLink="/auth/sign-in">Sign in</a>
        }

        <button
            [hlmDropdownMenuTrigger]="menu"
            hlmBtn
            variant="ghost"
            size="icon"
            aria-label="Open settings"
        >
            @switch (authState().status) {
                @case (AuthStatus.AUTHENTICATED) {
                    <hlm-avatar>
                        <span hlmAvatarFallback>{{ userInitials() }}</span>
                    </hlm-avatar>
                }
                @case (AuthStatus.UNAUTHENTICATED) {
                    <ng-icon hlm name="lucideSettings" />
                }
            }
        </button>

        <ng-template #menu>
            <hlm-dropdown-menu class="w-56">
                <hlm-dropdown-menu-group>
                    @if (authState().status === AuthStatus.AUTHENTICATED) {
                        <button hlmDropdownMenuItem>
                            <ng-icon hlm size="sm" name="lucideUser" class="text-foreground" />
                            <span>Profile</span>
                        </button>
                        <a hlmDropdownMenuItem routerLink="/settings">
                            <ng-icon hlm size="sm" name="lucideSettings" class="text-foreground" />
                            <span>Settings</span>
                        </a>
                    }
                    <button
                        hlmDropdownMenuItem
                        side="right"
                        align="start"
                        [hlmDropdownMenuTrigger]="themes"
                    >
                        <ng-icon hlm size="sm" name="lucidePalette" class="text-foreground" />
                        <span>Theme</span>
                        <hlm-dropdown-menu-item-sub-indicator />
                    </button>
                    @if (authState().status === AuthStatus.AUTHENTICATED) {
                        <button hlmDropdownMenuItem variant="destructive" (click)="signOut()">
                            <ng-icon hlm size="sm" name="lucideLogOut" class="text-foreground" />
                            <span>Sign out</span>
                        </button>
                    }
                </hlm-dropdown-menu-group>
            </hlm-dropdown-menu>
        </ng-template>

        <ng-template #themes>
            <hlm-dropdown-menu-sub>
                @let p = theme();
                <button
                    hlmDropdownMenuRadio
                    [checked]="p === 'system'"
                    (triggered)="setTheme('system')"
                >
                    <hlm-dropdown-menu-radio-indicator />
                    <ng-icon hlm size="sm" name="lucideMonitor" class="text-foreground mr-2.5" />
                    <span>System</span>
                </button>
                <button
                    hlmDropdownMenuRadio
                    [checked]="p === 'dark'"
                    (triggered)="setTheme('dark')"
                >
                    <hlm-dropdown-menu-radio-indicator />
                    <ng-icon hlm size="sm" name="lucideMoon" class="text-foreground mr-2.5" />
                    <span>Dark</span>
                </button>
                <button
                    hlmDropdownMenuRadio
                    [checked]="p === 'light'"
                    (triggered)="setTheme('light')"
                >
                    <hlm-dropdown-menu-radio-indicator />
                    <ng-icon hlm size="sm" name="lucideSun" class="text-foreground mr-2.5" />
                    <span>Light</span>
                </button>
            </hlm-dropdown-menu-sub>
        </ng-template>
    </div>
</header>

<router-outlet />
<hlm-toaster richColors [theme]="theme()" />
