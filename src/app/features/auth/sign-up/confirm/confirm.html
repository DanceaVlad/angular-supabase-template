<main class="container mx-auto flex min-h-[calc(100vh-3.5rem)] items-center justify-center px-4">
    <div class="w-full max-w-sm space-y-6 text-center">
        <div class="flex justify-center">
            <span class="bg-primary/10 text-primary flex h-16 w-16 items-center justify-center rounded-full">
                <ng-icon hlm size="lg" name="lucideMailCheck" />
            </span>
        </div>

        <div class="space-y-2">
            <h1 class="text-2xl font-semibold">Check your inbox</h1>
            @if (email) {
                <p class="text-muted-foreground text-sm">
                    We sent a confirmation link to
                    <span class="text-foreground font-medium">{{ email }}</span
                    >. Click it to activate your account.
                </p>
            } @else {
                <p class="text-muted-foreground text-sm">
                    We sent a confirmation link to your email address. Click it to activate your
                    account.
                </p>
            }
            <p class="text-muted-foreground text-sm">If you don't see it, check your spam folder.</p>
        </div>

        <a hlmBtn variant="outline" class="w-full" routerLink="/auth/sign-in">Back to sign in</a>
    </div>
</main>
