<div class="max-w-2xl space-y-6">
    <div>
        <h1 class="text-xl font-semibold">Public profile</h1>
        <p class="text-muted-foreground mt-1 text-sm">
            This information will be displayed on your account.
        </p>
    </div>

    <hlm-separator />

    @if (profile.isLoading()) {
        <hlm-spinner />
    } @else {
        <div class="space-y-4">
            <button
                type="button"
                [hlmDialogTriggerFor]="avatarDialog"
                class="group mx-auto flex cursor-pointer flex-col items-center gap-1.5 rounded-lg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2"
                aria-label="Change profile photo"
            >
                <div class="relative">
                    <hlm-avatar class="size-20">
                        @if (profile.value()?.avatar_url) {
                            <img
                                hlmAvatarImage
                                [src]="profile.value()!.avatar_url!"
                                alt="Profile photo"
                            />
                        }
                        <span hlmAvatarFallback class="text-2xl">{{ userInitials() }}</span>
                    </hlm-avatar>
                    <div
                        class="absolute inset-0 flex items-center justify-center rounded-full bg-black/40 opacity-0 transition-opacity group-hover:opacity-100 group-focus-visible:opacity-100"
                        aria-hidden="true"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" class="size-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </div>
                </div>
                <span class="text-muted-foreground text-sm group-hover:text-foreground transition-colors">Change photo</span>
            </button>

            <div class="space-y-1.5">
                <label hlmLabel for="email">Email</label>
                <input
                    hlmInput
                    id="email"
                    type="email"
                    class="w-full"
                    [value]="user()?.email ?? ''"
                    disabled
                />
            </div>

            <div class="space-y-1.5">
                <label hlmLabel for="name">Display name</label>
                <input
                    hlmInput
                    id="name"
                    type="text"
                    class="w-full"
                    placeholder="Your name"
                    [value]="displayName()"
                    (input)="updateDisplayName($event)"
                />
            </div>

            <div class="space-y-1.5">
                <label hlmLabel for="bio">Bio</label>
                <textarea
                    hlmTextarea
                    id="bio"
                    class="w-full"
                    placeholder="A short bio"
                    rows="4"
                    [value]="bio()"
                    (input)="updateBio($event)"
                ></textarea>
            </div>
        </div>

        <hlm-separator />

        <button hlmBtn type="button" (click)="save()">Update profile</button>
    }
</div>

<hlm-dialog #avatarDialog (closed)="closeAvatarDialog()">
    <ng-template hlmDialogPortal>
    <hlm-dialog-content class="max-w-md">
        <hlm-dialog-header>
            <h2 hlmDialogTitle>Update profile photo</h2>
            <p hlmDialogDescription>
                Upload a photo, then drag to reposition.
            </p>
        </hlm-dialog-header>

        <div class="py-4">
            @if (!cropperImageSrc()) {
                <label
                    for="avatar-upload"
                    class="border-border text-muted-foreground hover:border-primary hover:text-primary flex cursor-pointer flex-col items-center justify-center gap-2 rounded-lg border-2 border-dashed p-12 transition-colors"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="size-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
                    </svg>
                    <span class="text-sm font-medium">Click to upload a photo</span>
                    <span class="text-xs">PNG, JPG, WEBP up to 10MB</span>
                    <input
                        id="avatar-upload"
                        type="file"
                        accept="image/*"
                        class="sr-only"
                        (change)="onFileSelected($event)"
                    />
                </label>
            } @else {
                <img
                    [src]="cropperImageSrc()!"
                    alt="Crop preview"
                    class="block max-h-80 w-full"
                    (load)="onImageLoaded($event)"
                />
            }
        </div>

        <hlm-dialog-footer>
            <button hlmBtn variant="outline" hlmDialogClose (click)="closeAvatarDialog()">
                Cancel
            </button>
            <button
                hlmBtn
                type="button"
                [disabled]="!cropperImageSrc() || isSavingAvatar()"
                (click)="saveAvatar()"
            >
                @if (isSavingAvatar()) {
                    <hlm-spinner class="mr-2 size-4" />
                }
                Save photo
            </button>
        </hlm-dialog-footer>
    </hlm-dialog-content>
    </ng-template>
</hlm-dialog>
